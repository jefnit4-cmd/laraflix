    <script src="/posts_data.js"></script>
    <script>
        const grid = document.getElementById('grid');
        const tabs = document.querySelectorAll('.tab-btn');

        function render(filter) {
            const list = filter === 'all' ? posts : posts.filter(p => p.tag === filter);
            grid.innerHTML = list.map(p => `
                <a href="/posts/${p.slug}.html" class="group block bg-dark-100 rounded-2xl border border-white/5 overflow-hidden hover:border-brand-500/30 hover:shadow-xl hover:shadow-brand-500/5 transition-all duration-300 hover:-translate-y-1">
                    <div class="h-40 bg-dark-50 relative">
                        <img src="${p.cover}" alt="${p.title}" class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-dark-100/90 via-dark-100/10 to-transparent"></div>
                        <div class="absolute top-4 right-4 px-3 py-1 rounded-full ${p.tag === 'filmes' ? 'bg-brand-500' : 'bg-amber-500'} text-white text-xs font-bold uppercase tracking-wider">
                            ${p.tag === 'filmes' ? 'Filme' : 'Série'}
                        </div>
                    </div>
                    <div class="p-5">
                        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">${p.date} • ${p.readTime}</div>
                        <h3 class="text-lg font-bold text-white mb-2 group-hover:text-brand-500 transition-colors leading-snug">${p.title}</h3>
                        <p class="text-slate-400 text-sm leading-relaxed line-clamp-3">${p.excerpt}</p>
                        <div class="mt-4 flex items-center gap-1 text-brand-500 text-sm font-semibold opacity-0 group-hover:opacity-100 transition-opacity">
                            <span>Ler mais</span>
                            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        render('all');

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('active', 'bg-white/10', 'text-white');
                    t.classList.add('text-slate-400', 'hover:text-white');
                });
                btn.classList.add('active', 'bg-white/10', 'text-white');
                btn.classList.remove('text-slate-400', 'hover:text-white');
                render(btn.dataset.filter);
            });
        });

        document.getElementById('year').textContent = new Date().getFullYear();

        // Set initial active tab style
        document.querySelector('.tab-btn.active').classList.add('bg-white/10', 'text-white');
    </script>
</body>
</html>
